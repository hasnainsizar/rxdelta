name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=rxdelta/diff --cov=rxdelta/ingest --cov-report=term-missing --cov-fail-under=85

      - name: Demo end to end
        run: |
          uv run python scripts/generate_sample_data.py --out data
          uv run rxdelta load --month 2025-01 --dir data --db ci.db
          uv run rxdelta load --month 2025-02 --dir data --db ci.db
          uv run rxdelta summary --from 2025-01 --to 2025-02 --db ci.db
          uv run rxdelta report --from 2025-01 --to 2025-02 --out ci-report.html --db ci.db
          uv run rxdelta status --db ci.db
