[project]
name = "rxdelta"
version = "0.1.0"
description = "Monitor CMS Medicare Part D formulary files for changes that affect member out of pocket cost"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
]

[project.scripts]
rxdelta = "rxdelta.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rxdelta"]

[tool.hatch.build.targets.wheel.force-include]
"config/rxdelta.toml" = "rxdelta/_bundled/rxdelta.toml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["rxdelta", "scripts", "tests"]

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rxdelta/diff", "rxdelta/ingest"]
